# @package _global_
# Paraphrase Evaluation Experiment

defaults:
  - override /model: Llama-3.2-1B-Instruct
  - override /eval:
    - paraphrase_tofu

model:
  model_args:
    pretrained_model_name_or_path: ???  # Set to your unlearned model path

eval:
  paraphrase:
    batch_size: 8
    eval_cfg:
      output:
        task_name: ${task_name}

task_name: ???  # e.g., "paraphrase_eval_run1"
