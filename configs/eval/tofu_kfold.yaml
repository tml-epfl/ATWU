# @package eval.tofu
# NOTE: the above line is not a comment, but sets the package for config. See https://hydra.cc/docs/upgrades/0.11_to_1.0/adding_a_package_directive/
#
# Eval for the leave-one-fold-out (AUROC) experiment. Same extraction strengths as
# `tofu_repro`, plus per-example forget probability/loss — the classic MIA-style
# score — so the AUROC between unlearned and held-out rows can be computed from
# two different per-example quantities rather than one. Both `extraction_strength`
# and `forget_Q_A_Prob` write `value_by_index` over all 400 forget10 rows, which is
# what the fold split is applied to. `model_utility` is dropped: capability is
# covered by MMLU in the paraphrase stage.

defaults:
  - tofu_metrics:
    - extraction_strength
    - retain_extraction_strength
    - forget_Q_A_Prob

handler: TOFUEvaluator
output_dir: ${paths.output_dir} # set to default eval directory
metrics: {} # lists a mapping from each evaluation metric to its config
# populated through the first (@package) line in each metric config
overwrite: false
forget_split: forget10
holdout_split: holdout10
retain_logs_path: null
question_key: "question" # Specifies which key to use during forget and retain evaluations (e.g. "question" or "paraphrased_question")
batch_size: 32
